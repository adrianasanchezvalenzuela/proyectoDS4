{% extends "base.html" %}

{% block title %}Mis Favoritos | Repositorio UNISON{% endblock %}

{% block body %}
<div class="container mt-5">
    <h1>Mis Favoritos</h1>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Volver al inicio</a>
    
    <ul class="list-group mt-4">
        {% for revista in favoritos %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ revista.titulo }}</span>
                <div>
                    <a href="{{ url_for('eliminar_favorito', id_revista=revista.id) }}" class="btn btn-danger">
                        <i class="bi bi-heart-fill"></i> Eliminar
                    </a>
                    <a href="{{ url_for('eliminar_guardado', id_revista=revista.id) }}" class="btn btn-secondary ms-2">
                        <i class="bi bi-bookmark-fill"></i> Desguardar
                    </a>
                </div>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
